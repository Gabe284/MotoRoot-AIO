name: Android build

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_target:
        description: APK variant to build
        required: true
        type: choice
        options:
          - debug
          - release
          - both
        default: debug

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Verify Android SDK environment
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager -print -quit

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest

      - name: Build debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_target == 'debug' || inputs.build_target == 'both'
        run: gradle --no-daemon assembleDebug

      - name: Build release APK
        if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'release' || inputs.build_target == 'both')
        run: gradle --no-daemon assembleRelease

      - name: Upload debug APK
        if: github.event_name != 'workflow_dispatch' || inputs.build_target == 'debug' || inputs.build_target == 'both'
        uses: actions/upload-artifact@v4
        with:
          name: motoroot-aio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned release APK
        if: github.event_name == 'workflow_dispatch' && (inputs.build_target == 'release' || inputs.build_target == 'both')
        uses: actions/upload-artifact@v4
        with:
          name: motoroot-aio-release-unsigned-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
